# CI for quote-api, migrated from the legacy GitLab pipeline (see MIGRATION-NOTES.md).
#
# CI only: ArgoCD is the CD half. It pulls from Git and deploys, so this workflow never touches the cluster.
# Its last job only records the new image tag in Git.
#
# Runs on every pull request into main:
#   1. sast             Semgrep scans the whole repository; any finding fails the run.
#                       It also checks whether the PR changed app/main.py or app/Dockerfile.
#   2. image            Only if one of those files changed: build the image with its final tag, scan it with
#                       Trivy and, if it passes, push that same image to GHCR.
#   3. update-manifest  Write the new tag into charts/quote-api and commit it to the PR branch.
#
# A PR that does not touch the image gets the scan only; jobs 2 and 3 show as skipped.
# The image tag is the 7-character SHA of the PR head commit. After the merge, ArgoCD deploys that tag.
#
# Loop guard: the check in job 1 looks at the whole PR diff, so once a PR touches the app every later push
# (including the bump commit made by job 3) would start the pipeline again. Two guards prevent that: the
# bump commit message contains [skip ci], and job 1 is skipped for runs started by github-actions[bot].
name: CI

on:
  pull_request:
    branches: [main]

# Read-only by default; the jobs that need more ask for it.
permissions:
  contents: read

# A newer push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Scanners run as container images with a fixed version (never `latest`).
  SEMGREP_IMAGE: semgrep/semgrep:1.185.0
  TRIVY_IMAGE: aquasec/trivy:0.76.2

jobs:
  sast:
    name: 1. Scan the code (Semgrep)
    # Loop guard: skip runs started by the workflow's own push (the jobs that need this one are skipped too).
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      app_changed: ${{ steps.changes.outputs.app_changed }}
    steps:
      # Check out the PR head commit, not the synthetic merge commit, so the scanned, built and tagged code is one
      # real commit.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0   # the next step compares the PR with its base commit
          persist-credentials: false

      # Only these two files end up in the image. The three-dot diff lists exactly the files the PR changes,
      # even if main has moved on.
      - name: Did the PR change app/main.py or app/Dockerfile?
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(git diff --name-only "$BASE...$HEAD")"
          echo "$files"
          if grep -qxE 'app/main\.py|app/Dockerfile' <<< "$files"; then
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_changed=false" >> "$GITHUB_OUTPUT"
            echo "The app image is unchanged: the image jobs are skipped."
          fi

      # Hard gate: no `continue-on-error`, no `|| true`; any finding fails the job.
      # One rule is switched off on purpose: "mutable action tag", because actions are referenced by version tag
      # (for example actions/checkout@v7.0.1). Pinning to commit SHAs is stricter and is the better choice in
      # production (see MIGRATION-NOTES.md). The root user in toolbox/Dockerfile is suppressed with a
      # `# nosemgrep` comment next to the line it covers.
      - name: Semgrep (python, dockerfile, github-actions, secrets rule packs)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan \
              --config p/python --config p/dockerfile --config p/github-actions --config p/secrets \
              --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag \
              --metrics=off --error .

  image:
    name: 2. Build, scan (Trivy) and push the image
    needs: [sast]
    if: needs.sast.outputs.app_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # used only by the push step; the Trivy scan runs before the registry login
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Tag = 7-character git SHA (never `latest`). The registry path must be lowercase.
      - name: Work out the image name and tag
        id: vars
        run: |
          set -euo pipefail
          tag="$(git rev-parse --short=7 HEAD)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quote-api:${tag}" >> "$GITHUB_ENV"

      # Built once with its final name. amd64 only (see MIGRATION-NOTES.md).
      # The `source` label links the GHCR package to this repository.
      - name: Build the image (linux/amd64)
        run: |
          set -euo pipefail
          docker build \
            --build-arg "GIT_SHA=${IMAGE_TAG}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            -t "$IMAGE_REF" app

      # Gate: HIGH and CRITICAL vulnerabilities that already have a fix. Unfixed ones are ignored because nothing
      # can be done about them yet (remove --ignore-unfixed to see them).
      - name: Trivy (fails on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$IMAGE_REF"

      # PRs from forks get a read-only token and cannot push; they still get the build and scan.
      - name: Log in to GHCR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image that was just scanned
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: docker push "$IMAGE_REF"

  update-manifest:
    name: 3. Update the quote-api manifest (the image tag)
    needs: [image]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # to commit the new tag to the PR branch
    steps:
      # Check out the PR branch itself so the change can be pushed back. Full history is needed to compare the
      # branch with the commit the image was built from.
      - name: Checkout the PR branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      # Loop guard: [skip ci] in the commit message stops GitHub from starting a run for this commit.
      # (A push made with GITHUB_TOKEN does not reliably avoid new runs on its own.)
      - name: Set the new image tag in the chart and commit it to the PR branch
        env:
          TAG: ${{ needs.image.outputs.tag }}
          BUILT_COMMIT: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          # Only bump if app/ is unchanged since the image was built. Newer docs commits are fine; a manifest that
          # points at an image of older app code is not.
          if ! git cat-file -e "${BUILT_COMMIT}^{commit}" 2>/dev/null || ! git diff --quiet "$BUILT_COMMIT" HEAD -- app; then
            echo "The app changed after this image was built; refusing to point the manifest at a stale image." >&2
            exit 1
          fi
          sed -i -E "s|^(  tag: )[^ #]+|\1${TAG}|" charts/quote-api/values.yaml
          sed -i -E "s|^(appVersion: ).*|\1\"${TAG}\"|" charts/quote-api/Chart.yaml
          grep -q "^  tag: ${TAG}" charts/quote-api/values.yaml
          grep -q "^appVersion: \"${TAG}\"" charts/quote-api/Chart.yaml
          if git diff --quiet; then
            echo "The manifest already uses ${TAG}; nothing to commit."
            exit 0
          fi
          # The commit is attributed to whoever triggered the run, with GitHub's noreply address.
          git config user.name "$ACTOR"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          git add charts/quote-api/values.yaml charts/quote-api/Chart.yaml
          git commit -m "ci: update quote-api image tag to ${TAG} [skip ci]"
          git push origin "HEAD:${BRANCH}"
