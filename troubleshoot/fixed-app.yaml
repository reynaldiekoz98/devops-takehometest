# DevOps Assignment — Part 3: Troubleshooting Challenge
# Run troubleshoot/prepare.sh first, then apply this file as-is.
# Diagnose and fix until troubleshoot/verify.sh prints PASS.
# Rules:
#   - Do NOT delete the default-deny NetworkPolicy — add least-privilege allow rules instead.
#   - Do NOT remove node taints or labels — fix the workloads, not the nodes.
---
apiVersion: v1
kind: Namespace
metadata:
  name: troubleshoot
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: troubleshoot
data:
  index.html: |
    <html><body><h1>TROUBLESHOOT-OK</h1></body></html>
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: troubleshoot
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# FIX 9: least-privilege allow rules layered on top of default-deny (which is kept).
# Three paths are opened, each as narrowly as possible: DNS, client -> web, and into web.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-smoke-client-dns
  namespace: troubleshoot
spec:
  podSelector:
    matchLabels:
      app: smoke-client
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-smoke-client-to-web
  namespace: troubleshoot
spec:
  podSelector:
    matchLabels:
      app: smoke-client
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: web
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-ingress-from-smoke-client
  namespace: troubleshoot
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: smoke-client
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: troubleshoot
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.25.5   # FIX 3: tag 1.25.99 does not exist (ImagePullBackOff)
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi    # FIX 1: was 16Gi, larger than any node (Pending: Insufficient memory)
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80        # FIX 4: probes targeted 8080, nginx listens on 80
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80        # FIX 4: probes targeted 8080, nginx listens on 80
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: web-config   # FIX 2: was web-conf (ConfigMap not found, FailedMount)
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: troubleshoot
spec:
  selector:
    app: web              # FIX 5: was 'webapp', matched no pods (no endpoints)
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80      # FIX 6: was 8080, nginx listens on 80
---
# Simulated AI inference workload. In production this runs on our GPU
# nodepool. It must end up Running on the GPU-labeled node — without
# touching the node's taint or labels.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-inference
  namespace: troubleshoot
  labels:
    app: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-inference
  template:
    metadata:
      labels:
        app: ai-inference
    spec:
      nodeSelector:
        acme.io/node-type: gpu   # FIX 7: label key was 'node-type', the real label is acme.io/node-type
      tolerations:               # FIX 8: the GPU node is tainted nvidia.com/gpu=true:NoSchedule
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: inference
          image: busybox:1.36
          command: ["sh", "-c", "echo 'inference engine warm'; while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
